<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Algorhythm - Dynamic Multi-Station Radio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #06070b;
            background-image: radial-gradient(circle at center, #141728 0%, #06070b 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .radio-container {
            position: relative;
            width: 750px;
            height: 420px;
            background: #11131d;
            border-radius: 40px;
            padding: 25px;
            box-shadow: 
                0 0 30px rgba(0, 243, 255, 0.15),
                0 0 60px rgba(255, 0, 128, 0.15),
                inset 0 0 25px rgba(0,0,0,0.8);
            border: 4px solid #2a2e45;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .radio-container::before {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 46px;
            background: linear-gradient(90deg, #00f3ff, #ff007f);
            z-index: -1;
            filter: blur(12px);
            opacity: 0.8;
        }

        .antenna {
            position: absolute;
            top: -110px;
            right: 120px;
            width: 320px;
            height: 6px;
            background: linear-gradient(90deg, #888, #fff);
            transform: rotate(-35deg);
            transform-origin: bottom right;
            border-radius: 3px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        .antenna-tip {
            position: absolute;
            top: -130px;
            right: 435px;
            width: 14px;
            height: 14px;
            background: #ffaa00;
            border-radius: 50%;
            box-shadow: 0 0 15px #ffaa00, 0 0 30px #ffaa00;
        }

        .main-panel {
            display: flex;
            gap: 25px;
            height: 230px;
        }

        .speaker-section {
            flex: 1.1;
            background: #090a10;
            border-radius: 25px;
            border: 3px solid #222638;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }

        .speaker-grille {
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.03),
                rgba(255, 255, 255, 0.03) 4px,
                transparent 4px,
                transparent 10px
            );
        }

        .speaker-neon-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid #ff9900;
            box-shadow: 0 0 15px #ffaa00, inset 0 0 15px #ffaa00;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .tuner-section {
            flex: 1.3;
            background: #05060a;
            border-radius: 20px;
            border: 3px solid #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(0,0,0,0.8);
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #ffaa00;
            font-family: monospace;
            position: relative;
        }

        .tuner-scales {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
            text-shadow: 0 0 8px #ffaa00;
        }

        .tuner-line-container {
            position: relative;
            height: 35px;
            border-top: 2px solid #ffaa00;
            border-bottom: 2px solid #ffaa00;
            display: flex;
            align-items: center;
        }

        .tuner-needle {
            position: absolute;
            left: 58%;
            width: 4px;
            height: 30px;
            background: #ff0055;
            box-shadow: 0 0 12px #ff0055;
            transform: translateX(-50%);
            transition: left 0.5s ease;
        }

        .bottom-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .control-label {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #00f3ff;
            text-shadow: 0 0 8px #00f3ff;
        }

        .knob {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #ddd 30%, #444 80%);
            border: 4px solid #00f3ff;
            box-shadow: 0 0 15px #00f3ff, inset 0 0 10px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .knob-inner {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #555 20%, #111 90%);
            border: 2px solid #222;
            position: relative;
        }

        .knob-marker {
            position: absolute;
            top: 4px;
            left: 50%;
            width: 3px;
            height: 14px;
            background: #00f3ff;
            transform: translateX(-50%);
            border-radius: 2px;
            box-shadow: 0 0 6px #00f3ff;
        }

        .eq-center-bars {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #05060a;
            padding: 10px 20px;
            border-radius: 15px;
            border: 2px solid #ff9900;
            box-shadow: 0 0 12px rgba(255,153,0,0.4);
            cursor: pointer;
        }

        .eq-bar {
            width: 8px;
            height: 28px;
            background: #ff9900;
            border-radius: 4px;
            box-shadow: 0 0 10px #ff9900;
        }

        .playing .eq-bar:nth-child(1) { animation: bounce 0.6s infinite alternate; }
        .playing .eq-bar:nth-child(2) { animation: bounce 0.4s infinite alternate; }
        .playing .eq-bar:nth-child(3) { animation-delay: 0.2s; animation: bounce 0.5s infinite alternate; }

        .playing .speaker-neon-circle {
            box-shadow: 0 0 25px #ffaa00, inset 0 0 20px #ffaa00;
            transform: scale(1.02);
        }

        @keyframes bounce {
            0% { height: 10px; }
            100% { height: 36px; }
        }
    </style>
</head>
<body>

    <div class="radio-container" id="radio-box">
        <div class="antenna"></div>
        <div class="antenna-tip"></div>

        <div class="main-panel">
            <div class="speaker-section">
                <div class="speaker-grille"></div>
                <div class="speaker-neon-circle"></div>
            </div>

            <div class="tuner-section" id="station-display">
                <div class="tuner-scales">
                    <span id="station-name-tag">PULSEFM</span>
                    <span>FM 88 - 108 MHz</span>
                </div>
                <div class="tuner-line-container">
                    <div class="tuner-needle" id="tuner-needle"></div>
                </div>
                <div class="tuner-scales">
                    <span id="current-track-info" style="font-size: 0.75rem; color: #ff007f; text-shadow: 0 0 8px #ff007f;"></span>
                </div>
            </div>
        </div>

        <div class="bottom-panel">
            <div class="control-group">
                <span class="control-label">VOLUME</span>
                <div class="knob" id="volume-knob" title="Regola Volume">
                    <div class="knob-inner">
                        <div class="knob-marker" id="vol-marker"></div>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <div class="eq-center-bars" id="play-btn" title="Accendi / Spegni">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                </div>
            </div>

            <div class="control-group">
                <span class="control-label">TUNING</span>
                <div class="knob" id="tuning-knob" title="Cambia Stazione">
                    <div class="knob-inner">
                        <div class="knob-marker"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <audio id="main-audio"></audio>

    <script>
        // CONFIGURAZIONE DELLE 3 STAZIONI (PULSEFM, NEON REGGAETON, HAZE WAVE)
        const stations = {
            pulsefm: {
                name: "PULSEFM",
                freq: "25%",
                jingles: [
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/PulseFM/jingles/intro.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/PulseFM/jingles/1.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/PulseFM/jingles/2.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/PulseFM/jingles/3.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/PulseFM/jingles/4.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/PulseFM/jingles/5.mp3"
                ],
                songs: [
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/PulseFM/songs/Broken%20Ones.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/PulseFM/songs/Carry%20All%20The%20Weight.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/PulseFM/songs/Feel%20Alright.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/PulseFM/songs/Good%20Tonight.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/PulseFM/songs/High.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/PulseFM/songs/Only%20For%20Show.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/PulseFM/songs/Spinning%20Like%20A%20Top.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/PulseFM/songs/That's%20the%20Song%20I%20Sing.mp3"
                ]
            },
            reggaeton: {
                name: "NEON REGGAETON",
                freq: "58%",
                jingles: [
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/jingles/intro.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/jingles/1.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/jingles/2.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/jingles/3.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/jingles/4.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/jingles/5.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/jingles/7.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/jingles/8.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/jingles/9.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/jingles/10.mp3"
                ],
                songs: [
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/songs/Algo%20Que%20Decirte.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/songs/A%C3%AAn.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/songs/Bailamos%20Lento.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/songs/Dime%20que%20vas%20a%20hacer.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/songs/Escuela%20Secundaria.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/songs/Linda%20y%20Libre.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/songs/Mala%20de%20mente.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/songs/No%20Te%20Hagas%20El%20Importante.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/songs/No%20Vas%20A%20Ser%20F%C3%A1cil.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Neon%20Reggaeton/songs/Toma.mp3"
                ]
            },
            hazewave: {
                name: "HAZE WAVE",
                freq: "85%",
                jingles: [
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/jingles/intro.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/jingles/1.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/jingles/2.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/jingles/3.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/jingles/4.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/jingles/5.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/jingles/6.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/jingles/7.mp3"
                ],
                songs: [
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/songs/Attention%20and%20Devotion.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/songs/Blackford.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/songs/Cattive%20Vibes.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/songs/Cielo%20Che%20Cambia%20Tono.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/songs/FUORI.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/songs/Hey,%20Hey,%20Hey.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/songs/Master%20in%20Psicologia.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/songs/Night%20Shift.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/songs/Sunday%20Light.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/songs/Trust%20The%20Process.mp3",
                    "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/Haze%20Wave/songs/You%20Don't%20Have%20To.mp3"
                ]
            }
        };

        const generalIntro = "https://raw.githubusercontent.com/JGenius626/Algorhythm/main/intro.mp3";

        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('play-btn');
        const radioBox = document.getElementById('radio-box');
        const stationNameTag = document.getElementById('station-name-tag');
        const currentTrackInfo = document.getElementById('current-track-info');
        const tunerNeedle = document.getElementById('tuner-needle');
        const tuningKnob = document.getElementById('tuning-knob');
        const volumeKnob = document.getElementById('volume-knob');
        const volMarker = document.getElementById('vol-marker');

        let stationKeys = ['pulsefm', 'reggaeton', 'hazewave'];
        let currentStationIndex = 0;
        let currentKey = 'pulsefm';

        let isPlaying = false;
        let playState = 'stopped';
        let displayTimeout = null;
        let lastTrackText = "";

        // Pool per il mazzo di carte (shuffled deck) per ogni stazione
        let songPools = { pulsefm: [], reggaeton: [], hazewave: [] };
        let jinglePools = { pulsefm: [], reggaeton: [], hazewave: [] };

        function shuffleArray(arr) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function getNextFromPool(type, stationKey) {
            let pool = (type === 'song') ? songPools[stationKey] : jinglePools[stationKey];
            const source = (type === 'song') ? stations[stationKey].songs : stations[stationKey].jingles;

            if (!pool || pool.length === 0) {
                pool = shuffleArray(source);
            }

            const selected = pool.shift();

            if (type === 'song') songPools[stationKey] = pool;
            else jinglePools[stationKey] = pool;

            return selected;
        }

        function getSongTitle(url) {
            try {
                const decoded = decodeURIComponent(url);
                const filename = decoded.substring(decoded.lastIndexOf('/') + 1);
                return filename.replace('.mp3', '').toUpperCase();
            } catch (e) {
                return "";
            }
        }

        // Cambio stazione ciclico tra le tre emittenti tramite il pomello Tuning
        function toggleStation() {
            currentStationIndex = (currentStationIndex + 1) % stationKeys.length;
            currentKey = stationKeys[currentStationIndex];
            const st = stations[currentKey];

            stationNameTag.textContent = st.name;
            tunerNeedle.style.left = st.freq;
            
            clearTimeout(displayTimeout);
            lastTrackText = st.name;
            currentTrackInfo.textContent = st.name;

            if (isPlaying) {
                playNextDynamic();
            } else {
                displayTimeout = setTimeout(() => {
                    currentTrackInfo.textContent = "";
                }, 2000);
            }
        }

        tuningKnob.addEventListener('click', toggleStation);

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                isPlaying = true;
                radioBox.classList.add('playing');
                playState = 'intro';
                currentTrackInfo.textContent = ""; 
                audio.src = generalIntro;
                audio.play().catch(e => console.log(e));
            } else {
                stopRadio();
            }
        });

        function stopRadio() {
            audio.pause();
            audio.currentTime = 0;
            isPlaying = false;
            playState = 'stopped';
            radioBox.classList.remove('playing');
            currentTrackInfo.textContent = "";
            lastTrackText = "";
        }

        audio.onended = () => {
            if (!isPlaying) return;

            if (playState === 'intro') {
                playRandomJingle();
            } else if (playState === 'jingle') {
                playRandomSong();
            } else if (playState === 'song') {
                playRandomJingle();
            }
        };

        function playNextDynamic() {
            playRandomJingle();
        }

        function playRandomJingle() {
            playState = 'jingle';
            const jingleUrl = getNextFromPool('jingle', currentKey);
            audio.src = jingleUrl;
            audio.play().catch(e => console.log(e));
            
            lastTrackText = "";
            currentTrackInfo.textContent = "";
        }

        function playRandomSong() {
            playState = 'song';
            const songUrl = getNextFromPool('song', currentKey);
            audio.src = songUrl;
            audio.play().catch(e => console.log(e));
            
            const title = getSongTitle(songUrl);
            lastTrackText = title;
            currentTrackInfo.textContent = title;
        }

        let currentVolume = 0.8;
        audio.volume = currentVolume;

        volumeKnob.addEventListener('click', () => {
            currentVolume = (currentVolume >= 1.0) ? 0.2 : currentVolume + 0.2;
            audio.volume = currentVolume;
            const deg = (currentVolume * 270) - 135;
            volMarker.style.transform = `translateX(-50%) rotate(${deg}deg)`;
            
            clearTimeout(displayTimeout);
            currentTrackInfo.textContent = `VOLUME: ${Math.round(currentVolume * 100)}%`;
            
            displayTimeout = setTimeout(() => {
                if (isPlaying) {
                    currentTrackInfo.textContent = lastTrackText;
                } else {
                    currentTrackInfo.textContent = "";
                }
            }, 1500);
        });
    </script>
</body>
</html>
